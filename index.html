<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">منصة الامتحانات الذكية - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen flex items-center justify-center p-4 relative">

    <!-- زرار تبديل اللغة -->
    <div class="absolute top-4 left-4">
        <button onclick="toggleLanguage()" id="lang-btn" class="bg-purple-600/50 hover:bg-purple-600 text-xs px-3 py-1.5 rounded-lg border border-white/20 transition font-bold text-white">English</button>
    </div>

    <div class="max-w-md w-full bg-white/10 backdrop-blur-md border border-white/20 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-6">
            <h1 id="main-title" class="text-2xl font-bold text-purple-300">منصة الامتحانات الذكية</h1>
            <p id="main-subtitle" class="text-gray-300 text-sm mt-1">نظام تصحيح ذكي ومتابعة فورية</p>
        </div>

        <!-- تبديل الأزرار بين تسجيل الدخول وإنشاء الحساب -->
        <div class="flex bg-black/30 p-1 rounded-xl mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-bold rounded-lg transition bg-purple-600 text-white">تسجيل الدخول</button>
            <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-2 text-sm font-bold rounded-lg transition text-gray-400">إنشاء حساب</button>
        </div>

        <!-- نموذج تسجيل الدخول (الاسم + الـ ID + الباسورد) -->
        <div id="form-login" class="space-y-4">
            <div>
                <label id="lbl-login-name" class="block text-sm text-gray-300 mb-1">الاسم الكامل:</label>
                <input type="text" id="login_name" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500" placeholder="أدخل اسمك...">
            </div>
            <div>
                <label id="lbl-login-id" class="block text-sm text-gray-300 mb-1">معرّف الطالب (ID):</label>
                <input type="text" id="login_id" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500" placeholder="مثال: 123">
            </div>
            <div>
                <label id="lbl-login-pass" class="block text-sm text-gray-300 mb-1">كلمة المرور:</label>
                <input type="password" id="login_pass" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500" placeholder="كلمة المرور السرية">
            </div>
            <button onclick="handleLogin()" id="btn-login-submit" class="w-full bg-purple-600 hover:bg-purple-500 transition py-3 rounded-lg font-bold shadow-lg text-white">تسجيل الدخول</button>
        </div>

        <!-- نموذج إنشاء الحساب -->
        <div id="form-signup" class="space-y-4 hidden">
            <div>
                <label id="lbl-su-name" class="block text-sm text-gray-300 mb-1">الاسم الكامل:</label>
                <input type="text" id="signup_name" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500" placeholder="أدخل اسمك الثلاثي...">
            </div>
            <div>
                <label id="lbl-su-sphone" class="block text-sm text-gray-300 mb-1">هاتف الطالب:</label>
                <input type="text" id="signup_sphone" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500" placeholder="01xxxxxxxx">
            </div>
            <div>
                <label id="lbl-su-fphone" class="block text-sm text-gray-300 mb-1">هاتف ولي الأمر:</label>
                <input type="text" id="signup_fphone" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500" placeholder="01xxxxxxxx">
            </div>
            <div>
                <label id="lbl-su-email" class="block text-sm text-gray-300 mb-1">البريد الإلكتروني:</label>
                <input type="email" id="signup_email" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500" placeholder="example@gmail.com">
            </div>
            <div>
                <label id="lbl-su-id" class="block text-sm text-gray-300 mb-1">معرّف الطالب (ID):</label>
                <input type="text" id="signup_id" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500" placeholder="مثال: 123">
            </div>
            <div>
                <label id="lbl-su-pass" class="block text-sm text-gray-300 mb-1">كلمة المرور:</label>
                <input type="password" id="signup_pass" class="w-full bg-black/30 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500" placeholder="أنشئ كلمة مرور...">
            </div>
            <button onclick="handleSignup()" id="btn-su-submit" class="w-full bg-purple-600 hover:bg-purple-500 transition py-3 rounded-lg font-bold shadow-lg text-white">إنشاء الحساب</button>
        </div>
    </div>

    <script>
        let currentLang = localStorage.getItem('siteLang') || 'ar';

        const dict = {
            ar: {
                title: "منصة الامتحانات الذكية - تسجيل الدخول",
                mainTitle: "منصة الامتحانات الذكية",
                subtitle: "نظام تصحيح ذكي ومتابعة فورية",
                tabLogin: "تسجيل الدخول",
                tabSignup: "إنشاء حساب",
                loginName: "الاسم الكامل:",
                loginId: "معرّف الطالب (ID):",
                loginPass: "كلمة المرور:",
                loginBtn: "تسجيل الدخول",
                suName: "الاسم الكامل:",
                suSPhone: "هاتف الطالب:",
                suFPhone: "هاتف ولي الأمر:",
                suEmail: "البريد الإلكتروني:",
                suId: "معرّف الطالب (ID):",
                suPass: "كلمة المرور:",
                suBtn: "إنشاء الحساب",
                alertFill: "يرجى ملء الحقول (الاسم، ID، وكلمة المرور)!",
                alertExist: "هذا الـ ID مسجل مسبقاً، يرجى تسجيل الدخول مباشرة.",
                alertSuccess: "تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.",
                alertError: "الاسم، المعرّف (ID)، أو كلمة المرور غير صحيحة!"
            },
            en: {
                title: "Smart Exam System - Login",
                mainTitle: "Smart Exam System",
                subtitle: "AI Correction & Live Monitoring",
                tabLogin: "Login",
                tabSignup: "Sign Up",
                loginName: "Full Name:",
                loginId: "Student ID:",
                loginPass: "Password:",
                loginBtn: "Login",
                suName: "Full Name:",
                suSPhone: "Student Phone:",
                suFPhone: "Father Phone:",
                suEmail: "Email Address:",
                suId: "Student ID:",
                suPass: "Password:",
                suBtn: "Create Account",
                alertFill: "Please fill in Name, ID, and Password fields!",
                alertExist: "This ID is already registered. Please log in directly.",
                alertSuccess: "Account created successfully! You can now log in.",
                alertError: "Name, ID, or password is incorrect!"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('siteLang', currentLang);
            applyLang();
        }
        function applyLang() {
            let t = dict[currentLang];
            let root = document.getElementById('html-root');
            root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            root.setAttribute('lang', currentLang);

            document.getElementById('page-title').innerText = t.title;
            document.getElementById('main-title').innerText = t.mainTitle;
            document.getElementById('main-subtitle').innerText = t.subtitle;
            document.getElementById('tab-login').innerText = t.tabLogin;
            document.getElementById('tab-signup').innerText = t.tabSignup;
            
            document.getElementById('lbl-login-name').innerText = t.loginName;
            document.getElementById('lbl-login-id').innerText = t.loginId;
            document.getElementById('lbl-login-pass').innerText = t.loginPass;
            document.getElementById('btn-login-submit').innerText = t.loginBtn;

            document.getElementById('lbl-su-name').innerText = t.suName;
            document.getElementById('lbl-su-sphone').innerText = t.suSPhone;
            document.getElementById('lbl-su-fphone').innerText = t.suFPhone;
            document.getElementById('lbl-su-email').innerText = t.suEmail;
            document.getElementById('lbl-su-id').innerText = t.suId;
            document.getElementById('lbl-su-pass').innerText = t.suPass;
            document.getElementById('btn-su-submit').innerText = t.suBtn;

            document.getElementById('lang-btn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
        }

        applyLang();

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');
            let t = dict[currentLang];

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg transition bg-purple-600 text-white";
                signupBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg transition text-gray-400";
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                signupBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg transition bg-purple-600 text-white";
                loginBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg transition text-gray-400";
            }
        }

        function handleSignup() {
            let name = document.getElementById('signup_name').value.trim();
            let sphone = document.getElementById('signup_sphone').value.trim();
            let fphone = document.getElementById('signup_fphone').value.trim();
            let email = document.getElementById('signup_email').value.trim();
            let id = document.getElementById('signup_id').value.trim();
            let pass = document.getElementById('signup_pass').value.trim();
            let t = dict[currentLang];

            if(!name || !id || !pass) {
                alert(t.alertFill);
                return;
            }

            let users = JSON.parse(localStorage.getItem('studentsDB')) || {};
            if(users[id]) {
                alert(t.alertExist);
                switchTab('login');
                return;
            }

            users[id] = { name, sphone, fphone, email, id, password: pass };
            localStorage.setItem('studentsDB', JSON.stringify(users));
            alert(t.alertSuccess);
            switchTab('login');
        }

        function handleLogin() {
            let name = document.getElementById('login_name').value.trim();
            let id = document.getElementById('login_id').value.trim();
            let pass = document.getElementById('login_pass').value.trim();
            let t = dict[currentLang];
            if(!name || !id || !pass) {
                alert(t.alertFill);
                return;
            }

            let users = JSON.parse(localStorage.getItem('studentsDB')) || {};
            // التحقق من أن الاسم والـ ID والباسورد متطابقين تماماً مع الحساب المسجل
            if(!users[id] || users[id].password !== pass || users[id].name !== name) {
                alert(t.alertError);
                return;
            }

            localStorage.setItem('currentStudentID', id);
            localStorage.setItem('currentStudentName', users[id].name);
            window.location.href = "exam.html";
        }
    </script>
</body>
</html>
