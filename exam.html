<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">امتحان المادة الدراسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen p-4 flex flex-col items-center">

    <div class="max-w-2xl w-full bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-2xl shadow-2xl text-white relative">
        
        <!-- زرار تبديل اللغة -->
        <div class="absolute top-4 left-4">
            <button onclick="toggleLanguage()" id="lang-btn" class="bg-purple-600/50 hover:bg-purple-600 text-xs px-3 py-1.5 rounded-lg border border-white/20 transition font-bold">English</button>
        </div>

        <!-- رأس الصفحة ومعلومات الطالب -->
        <div class="flex justify-between items-center border-b border-white/20 pb-4 mb-6 mt-4">
            <div>
                <h1 id="exam-heading" class="text-xl font-bold text-purple-300">امتحان المادة الدراسية</h1>
                <p id="student-info" class="text-sm text-gray-300 mt-1"></p>
            </div>
            <div id="timer-box" class="bg-red-600/30 border border-red-500 px-4 py-2 rounded-xl text-center">
                <span id="timer-label" class="text-xs text-red-300 block">الوقت المتبقي</span>
                <span id="time-left" class="font-bold text-lg">10:00</span>
            </div>
        </div>

        <!-- محتوى الصفحة -->
        <div id="exam-container">
            <div class="text-center py-10 text-gray-300">جاري تحميل بيانات الامتحان من السيرفر...</div>
        </div>

    </div>

    <script type="module">
        import { db, doc, setDoc, getDoc } from "./firebase.js";

        let currentLang = localStorage.getItem('siteLang') || 'ar';
        let examSettings = { duration: 10, status: 'متاح للطلاب' };
        let questions = [];
        let submissions = {};

        const translations = {
            ar: {
                title: "امتحان المادة الدراسية",
                heading: "امتحان المادة الدراسية",
                timerLabel: "الوقت المتبقي",
                welcome: "مرحباً بك، ",
                noQuestions: "لا توجد أسئلة مضافة في الامتحان حالياً.",
                notAvailable: "الامتحان غير متاح حالياً، يرجى الانتظار لحين فتحه من قبل أستاذ المادة.",
                submitBtn: "تسليم الإجابات وإنهاء الامتحان",
                successAlert: "تم تسليم الامتحان بنجاح!",
                gradedTitle: "تم تصحيح امتحانك واعتدامه من أستاذ المادة",
                finalScoreText: "الدرجة النهـائية: ",
                fromText: " من ",
                teacherNotes: "ملاحظات الأستاذ: ",
                noNotes: "لا توجد ملاحظات",
                pendingTitle: "تم تسليم إجاباتك بنجاح!",
                pendingStatus: "جاري التصحيح بواسطة أستاذ المادة",
                pendingSub: "يمكنك العودة لاحقاً لمتابعة النتيجة بعد اعتمادها.",
                uploadImgLabel: "رفع صورة توضيحية للإجابة (اختياري):",
                essayPlaceholder: "اكتب إجابتك النصية هنا..."
            },
            en: {
                title: "Course Exam",
                heading: "Course Examination",
                timerLabel: "Time Remaining",
                welcome: "Welcome, ",
                noQuestions: "No questions available for this exam currently.",
                notAvailable: "The exam is currently closed. Please wait for the instructor to open it.",
                submitBtn: "Submit Answers & Finish Exam",
                successAlert: "Exam submitted successfully!",
                gradedTitle: "Your exam has been graded and approved",
                finalScoreText: "Final Score: ",
                fromText: " out of ",
                teacherNotes: "Instructor Notes: ",
                noNotes: "No notes available",
                pendingTitle: "Your answers have been submitted successfully!",
                pendingStatus: "Under review by instructor",
                pendingSub: "You can check back later for your final grade after approval.",
                uploadImgLabel: "Upload supplementary image (Optional):",
                essayPlaceholder: "Type your text answer here..."
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('siteLang', currentLang);
            applyLanguage();
            renderExamPage();
        }

        function applyLanguage() {
            let t = translations[currentLang];
            let root = document.getElementById('html-root');
            root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            root.setAttribute('lang', currentLang);

            document.getElementById('page-title').innerText = t.title;
            document.getElementById('exam-heading').innerText = t.heading;
            document.getElementById('timer-label').innerText = t.timerLabel;
            document.getElementById('lang-btn').innerText = currentLang === 'ar' ? 'English' : 'عربي';

            const studentID = localStorage.getItem('currentStudentID');
            const studentName = localStorage.getItem('currentStudentName');
            if(studentID) {
                document.getElementById('student-info').innerText = t.welcome + studentName + " (ID: " + studentID + ")";
            }
        }

        const studentID = localStorage.getItem('currentStudentID');
        const studentName = localStorage.getItem('currentStudentName');

        if (!studentID) {
            alert(currentLang === 'ar' ? "يرجى تسجيل الدخول أولاً!" : "Please log in first!");
            window.location.href = "index.html";
        }

        applyLanguage();

        // جلب الإعدادات والأسئلة والتسليمات من Firebase مباشرة
        async function loadExamDataFromFirebase() {
            try {
                // 1. جلب إعدادات الامتحان
                let settingsSnap = await getDoc(doc(db, "settings", "exam"));
                if (settingsSnap.exists()) {
                    examSettings = settingsSnap.data();
                }

                // 2. جلب الأسئلة
                let questionsSnap = await getDoc(doc(db, "examData", "questionsBank"));
                if (questionsSnap.exists() && questionsSnap.data().list) {
                    questions = questionsSnap.data().list;
                }

                // 3. جلب تسليمات الطلاب
                let submissionsSnap = await getDoc(doc(db, "examData", "submissions"));
                if (submissionsSnap.exists() && submissionsSnap.data().list) {
                    submissions = submissionsSnap.data().list;
                }

            } catch (error) {
                console.error("Error loading exam data from Firebase:", error);
            }

            // بعد جلب البيانات، نبدأ عرض الصفحة وتشغيل المؤقت
            renderExamPage();
            initTimer();
        }

        loadExamDataFromFirebase();

        function renderExamPage() {
            let t = translations[currentLang];
            const container = document.getElementById('exam-container');
            container.innerHTML = "";

            if (submissions[studentID]) {
                let sub = submissions[studentID];
                let box = document.createElement('div');
                box.className = "text-center py-10 space-y-4";

                if (sub.status === 'معتمد' || sub.graded) {
                    let totalPoints = questions.reduce((a, b) => a + (b.points || 5), 0);
                    
                    let icon = document.createElement('div');
                    icon.className = "text-green-400 text-5xl";
                    icon.innerText = "✓";
                    box.appendChild(icon);

                    let title = document.createElement('h2');
                    title.className = "text-2xl font-bold";
                    title.innerText = t.gradedTitle;
                    box.appendChild(title);

                    let scoreCard = document.createElement('div');
                    scoreCard.className = "bg-black/30 p-4 rounded-xl inline-block border border-white/10";
                    scoreCard.innerHTML = '<p class="text-lg">' + t.finalScoreText + '<span class="font-bold text-yellow-400 text-2xl">' + sub.finalScore + '</span>' + t.fromText + totalPoints + '</p>';
                    box.appendChild(scoreCard);

                    let notes = document.createElement('p');
                    notes.className = "text-sm text-gray-400";
                    notes.innerText = t.teacherNotes + (sub.teacherNotes || t.noNotes);
                    box.appendChild(notes);
                } else {
                    let spinner = document.createElement('div');
                    spinner.className = "animate-spin rounded-full h-12 w-12 border-b-2 border-purple-400 mx-auto";
                    box.appendChild(spinner);

                    let title = document.createElement('h2');
                    title.className = "text-xl font-bold text-yellow-300";
                    title.innerText = t.pendingTitle;
                    box.appendChild(title);
                    let statusText = document.createElement('p');
                    statusText.className = "text-gray-300";
                    statusText.innerHTML = currentLang === 'ar' ? 'حالة الامتحان: <span class="text-yellow-400 font-bold">' + t.pendingStatus + '</span>' : 'Status: <span class="text-yellow-400 font-bold">' + t.pendingStatus + '</span>';
                    box.appendChild(statusText);

                    let subText = document.createElement('p');
                    subText.className = "text-sm text-gray-400";
                    subText.innerText = t.pendingSub;
                    box.appendChild(subText);
                }

                container.appendChild(box);
                let timerBox = document.getElementById('timer-box');
                if(timerBox) timerBox.style.display = 'none';
                return;
            }

            if (examSettings.status !== 'متاح للطلاب' && examSettings.status !== 'Open') {
                let msg = document.createElement('div');
                msg.className = "text-center py-10 text-red-300 font-bold";
                msg.innerText = t.notAvailable;
                container.appendChild(msg);
                let timerBox = document.getElementById('timer-box');
                if(timerBox) timerBox.style.display = 'none';
                return;
            }

            if (questions.length === 0) {
                let msg = document.createElement('div');
                msg.className = "text-center py-10 text-gray-300";
                msg.innerText = t.noQuestions;
                container.appendChild(msg);
                return;
            }

            let form = document.createElement('form');
            form.id = "submit-form";
            form.className = "space-y-6";
            form.onsubmit = submitExam;

            questions.forEach((q, index) => {
                let qCard = document.createElement('div');
                qCard.className = "bg-black/20 p-4 rounded-xl border border-white/10 space-y-3";

                let qTitle = document.createElement('label');
                qTitle.className = "block font-bold text-purple-200";
                qTitle.innerText = (index + 1) + ". " + q.text;
                qCard.appendChild(qTitle);

                if (q.type === 'mcq' && q.rawOptions && q.rawOptions.length > 0) {
                    q.rawOptions.forEach((optText, optIdx) => {
                        let arabicLetters = ['أ', 'ب', 'ج', 'د', 'هـ'];
                        let letter = arabicLetters[optIdx] || (optIdx + 1);
                        let fullOptionValue = letter + ") " + optText;

                        let optLabel = document.createElement('label');
                        optLabel.className = "flex items-center space-x-3 space-x-reverse bg-black/30 p-2 rounded-lg cursor-pointer hover:bg-black/50";
                        
                        let radio = document.createElement('input');
                        radio.type = "radio";
                        radio.name = "q_" + index;
                        radio.value = fullOptionValue;
                        radio.required = true;
                        radio.className = "text-purple-600";

                        let span = document.createElement('span');
                        span.innerText = fullOptionValue;

                        optLabel.appendChild(radio);
                        optLabel.appendChild(span);
                        qCard.appendChild(optLabel);
                    });
                } else {
                    let textarea = document.createElement('textarea');
                    textarea.name = "q_" + index;
                    textarea.rows = 3;
                    textarea.required = true;
                    textarea.className = "w-full bg-black/40 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500";
                    textarea.placeholder = t.essayPlaceholder;
                    qCard.appendChild(textarea);
                }

                let fileBox = document.createElement('div');
                fileBox.className = "pt-2";
                
                let fileLabel = document.createElement('label');
                fileLabel.className = "text-xs text-gray-300 block mb-1";
                fileLabel.innerText = t.uploadImgLabel;
                fileBox.appendChild(fileLabel);

                let fileInput = document.createElement('input');
                fileInput.type = "file";
                fileInput.id = "file_" + index;
                fileInput.accept = "image/*";
                fileInput.className = "text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer";
                fileBox.appendChild(fileInput);

                qCard.appendChild(fileBox);
                form.appendChild(qCard);
            });

            let submitBtn = document.createElement('button');
            submitBtn.type = "submit";
            submitBtn.className = "w-full bg-green-600 hover:bg-green-500 transition py-3 rounded-lg font-bold shadow-lg text-white";
            submitBtn.innerText = t.submitBtn;
            form.appendChild(submitBtn);

            container.appendChild(form);
        }

        function submitExam(e) {
            e.preventDefault();
            let studentAnswers = {};
            let totalQ = questions.length;

            questions.forEach((q, index) => {
                let ans = "";
                if (q.type === 'mcq') {
                    let selected = document.querySelector('input[name="q_' + index + '"]:checked');
                    ans = selected ? selected.value : "";
                } else {
                    let textareaElem = document.querySelector('textarea[name="q_' + index + '"]');
                    ans = textareaElem ? textareaElem.value : "";
                }
                
                let fileInput = document.getElementById('file_' + index);
                if (fileInput && fileInput.files && fileInput.files[0]) {
                    let reader = new FileReader();
                    reader.onload = function(uploadEvent) {
                        finalizeSubmission(studentAnswers, index, ans, uploadEvent.target.result, totalQ);
                    };
                    reader.readAsDataURL(fileInput.files[0]);
                } else {
                    finalizeSubmission(studentAnswers, index, ans, null, totalQ);
                }
            });
        }

        async function finalizeSubmission(answersObj, qIndex, answerValue, imageBase64, totalQ) {
            answersObj[qIndex] = {
                answer: answerValue,
                image: imageBase64 || null
            };
            
            let currentProcessed = Object.keys(answersObj).length;

            if (currentProcessed === totalQ) {
                let initialScore = 0;
                questions.forEach((q, idx) => {
                    let studentAnsObj = answersObj[idx]?.answer || "";
                    let modelAns = (q.modelAnswer || "").trim().toLowerCase();

                    let studentFirstChar = studentAnsObj.trim().charAt(0); 
                    let modelFirstChar = modelAns.charAt(0);

                    if (q.type === 'mcq' && studentFirstChar === modelFirstChar && modelFirstChar !== "") {
                        initialScore += (q.points || 5);
                    } else if (q.type === 'essay' && studentAnsObj.toLowerCase().includes(modelAns) && modelAns !== "") {
                        initialScore += (q.points || 5);
                    }
                });

                submissions[studentID] = {
                    studentId: studentID,
                    studentName: studentName,
                    answers: answersObj,
                    autoScore: initialScore,
                    finalScore: initialScore,
                    status: currentLang === 'ar' ? 'قيد المراجعة' : 'Under Review',
                    graded: false,
                    teacherNotes: ''
                };

                try {
                    // حفظ إجابة الطالب في Firebase بشكل دائم
                    await setDoc(doc(db, "examData", "submissions"), { list: submissions });
                    alert(translations[currentLang].successAlert);
                    renderExamPage();
                } catch(error) {
                    console.error("Error submitting exam:", error);
                    alert("حدث خطأ أثناء إرسال الامتحان للسيرفر.");
                }
            }
        }

        // إعداد المؤقت بدقة بحيث يعتمد الوقت الجديد من إعدادات الأستاذ فوراً
        // إعداد المؤقت بحيث يبدأ دائماً من المدة الكاملة المحددة عند كل تحديث (Refresh) للصفحة
        function initTimer() {
            let durationMinutes = parseInt(examSettings.duration) || 10;
            let totalSeconds = durationMinutes * 60;

            // مسح أي وقت قديم مخزن لضمان بدء العد من جديد دائماً عند تحديث الصفحة
            localStorage.removeItem('examRemainingSeconds');
            localStorage.removeItem('lastExamDuration');

            let timerInterval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert(currentLang === 'ar' ? "انتهى وقت الامتحان!" : "Exam time ended!");
                    return;
                }
                totalSeconds--;

                let m = Math.floor(totalSeconds / 60);
                let s = totalSeconds % 60;
                let timerElem = document.getElementById('time-left');
                if (timerElem) {
                    timerElem.innerText = m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');
                }
            }, 1000);
        }

        window.toggleLanguage = toggleLanguage;
    </script>
</body>
</html>
