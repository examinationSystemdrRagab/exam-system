<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">امتحان المادة الدراسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen p-4 flex flex-col items-center">
    <div class="max-w-2xl w-full bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-2xl shadow-2xl text-white relative">
        <div class="absolute top-4 left-4">
            <button onclick="toggleLanguage()" id="lang-btn" class="bg-purple-600/50 hover:bg-purple-600 text-xs px-3 py-1.5 rounded-lg border border-white/20 transition font-bold">English</button>
        </div>
        <div class="flex justify-between items-center border-b border-white/20 pb-4 mb-6 mt-4">
            <div>
                <h1 id="exam-heading" class="text-xl font-bold text-purple-300">امتحان المادة الدراسية</h1>
                <p id="student-info" class="text-sm text-gray-300 mt-1"></p>
            </div>
            <div id="timer-box" class="bg-red-600/30 border border-red-500 px-4 py-2 rounded-xl text-center">
                <span id="timer-label" class="text-xs text-red-300 block">الوقت المتبقي</span>
                <span id="time-left" class="font-bold text-lg">10:00</span>
            </div>
        </div>
        <div id="exam-container">
            <div class="text-center py-10 text-gray-300">جاري تحميل بيانات الامتحان من السيرفر...</div>
        </div>
    </div>
    <script type="module">
        import { db, doc, setDoc, getDoc } from "./firebase.js";
function addAIFile(content,data,label){
    if(!data)return;
    if(data.startsWith("data:application/pdf")){
        content.push({type:"input_file",file_data:data,filename:(label||"file")+".pdf"});
    }else if(data.startsWith("data:image/")){
        content.push({type:"input_image",image_url:data,detail:"high"});
    }
}
function getAIText(data){
    if(data.output_text)return data.output_text;
    for(const item of data.output||[]){
        for(const part of item.content||[]){
            if(part.type==="output_text"&&part.text)return part.text;
        }
    }
    return "";
}
async function callAI(content,apiKey){
    const response=await fetch("https://api.openai.com/v1/responses",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},
        body:JSON.stringify({model:"gpt-4o",input:[{role:"user",content}],text:{format:{type:"json_schema",name:"exam_grading",strict:true,schema:{type:"object",properties:{studentTranscription:{type:"string"},awardedPoints:{type:"number"},feedback:{type:"string"}},required:["studentTranscription","awardedPoints","feedback"],additionalProperties:false}}},max_output_tokens:1200,store:false})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data?.error?.message||("OpenAI HTTP "+response.status));
    if(data?.incomplete_details)throw new Error("OpenAI response was incomplete");
    if(data?.output?.some(x=>x.type==="message"&&x.content?.some(y=>y.type==="refusal")))throw new Error("OpenAI refused to analyze the image");
    const text=getAIText(data).trim();
    if(!text)throw new Error("OpenAI returned no text output");
    return text.replace(/```json/gi,"").replace(/```/g,"").trim();
}
        let currentLang = localStorage.getItem('siteLang') || 'ar';
        let examSettings = { duration: 10, status: 'متاح للطلاب' };
        let questions = [];
        let submissions = {};
        const translations = {
            ar: {
                title: "امتحان المادة الدراسية",
                heading: "امتحان المادة الدراسية",
                timerLabel: "الوقت المتبقي",
                welcome: "مرحباً بك، ",
                noQuestions: "لا توجد أسئلة مضافة في الامتحان حالياً.",
                notAvailable: "الامتحان غير متاح حالياً، يرجى الانتظار لحين فتحه من قبل أستاذ المادة.",
                submitBtn: "تسليم الإجابات وإنهاء الامتحان",
                successAlert: "تم تسليم الامتحان وتصحيحه بنجاح!",
                gradedTitle: "تم تصحيح امتحانك ورصد درجتك أوتوماتيكياً بواسطة الـ AI",
                finalScoreText: "الدرجة النهـائية: ",
                fromText: " من ",
                detailedFeedbackTitle: "التصحيح المفصل والتعليقات:",
                pendingTitle: "جاري التصحيح التلقائي...",
                pendingStatus: "يتم فحص إجاباتك الآن بواسطة الـ AI",
                pendingSub: "يرجى الانتظار لحظات حتى تظهر النتيجة.",
                uploadImgLabel: "رفع صورة أو ملف PDF للإجابة المكتوبة بخط اليد:",
                essayPlaceholder: "اكتب إجابتك النصية هنا..."
            },
            en: {
                title: "Course Exam",
                heading: "Course Examination",
                timerLabel: "Time Remaining",
                welcome: "Welcome, ",
                noQuestions: "No questions available for this exam currently.",
                notAvailable: "The exam is currently closed. Please wait for the instructor to open it.",
                submitBtn: "Submit Answers & Finish Exam",
                successAlert: "Exam submitted and graded successfully!",
                gradedTitle: "Your exam has been graded automatically by AI",
                finalScoreText: "Final Score: ",
                fromText: " out of ",
                detailedFeedbackTitle: "Detailed AI Feedback & Evaluation:",
                pendingTitle: "Evaluating automatically...",
                pendingStatus: "Your answers are being evaluated by AI",
                pendingSub: "Please wait a moment for your results.",
                uploadImgLabel: "Upload handwriting image or PDF file for answer:",
                essayPlaceholder: "Type your text answer here..."
            }
        };
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('siteLang', currentLang);
            applyLanguage();
            renderExamPage();
        }
        function applyLanguage() {
            let t = translations[currentLang];
            let root = document.getElementById('html-root');
            root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            root.setAttribute('lang', currentLang);
            document.getElementById('page-title').innerText = t.title;
            document.getElementById('exam-heading').innerText = t.heading;
            document.getElementById('timer-label').innerText = t.timerLabel;
            document.getElementById('lang-btn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
            const studentID = localStorage.getItem('currentStudentID');
            const studentName = localStorage.getItem('currentStudentName');
            if(studentID) {
                document.getElementById('student-info').innerText = t.welcome + studentName + " (ID: " + studentID + ")";
            }
        }
        const studentID = localStorage.getItem('currentStudentID');
        const studentName = localStorage.getItem('currentStudentName');
        if (!studentID) {
            alert(currentLang === 'ar' ? "يرجى تسجيل الدخول أولاً!" : "Please log in first!");
            window.location.href = "index.html";
        }
        applyLanguage();
        async function loadExamDataFromFirebase() {
            try {
                let settingsSnap = await getDoc(doc(db, "settings", "exam"));
                if (settingsSnap.exists()) {
                    examSettings = settingsSnap.data();
                }
                let questionsSnap = await getDoc(doc(db, "examData", "questionsBank"));
                if (questionsSnap.exists() && questionsSnap.data().list) {
                    questions = questionsSnap.data().list;
                }
                let submissionsSnap = await getDoc(doc(db, "examData", "submissions"));
                if (submissionsSnap.exists() && submissionsSnap.data().list) {
                    submissions = submissionsSnap.data().list;
                }
            } catch (error) {
                console.error("Error loading exam data:", error);
            }
            renderExamPage();
            initTimer();
        }
        loadExamDataFromFirebase();
        function renderExamPage() {
            let t = translations[currentLang];
            const container = document.getElementById('exam-container');
            container.innerHTML = "";
            if (submissions[studentID]) {
                let sub = submissions[studentID];
                let box = document.createElement('div');
                box.className = "text-center py-6 space-y-4";
                if (sub.status === 'معتمد' || sub.graded) {
                    let totalPoints = questions.reduce((a, b) => a + (b.points || 5), 0);
                    let icon = document.createElement('div');
                    icon.className = "text-green-400 text-4xl";
                    icon.innerText = "✓";
                    box.appendChild(icon);
                    let title = document.createElement('h2');
                    title.className = "text-xl font-bold";
                    title.innerText = t.gradedTitle;
                    box.appendChild(title);
                    let scoreCard = document.createElement('div');
                    scoreCard.className = "bg-black/30 p-3 rounded-xl inline-block border border-white/10";
                    scoreCard.innerHTML = '<p class="text-md">' + t.finalScoreText + '<span class="font-bold text-yellow-400 text-xl">' + sub.finalScore + '</span>' + t.fromText + totalPoints + '</p>';
                    box.appendChild(scoreCard);
                    let feedbackBox = document.createElement('div');
                    feedbackBox.className = "text-right space-y-3 mt-4 bg-black/20 p-4 rounded-xl border border-white/10 text-xs";
                    let fbTitle = document.createElement('h3');
                    fbTitle.className = "font-bold text-purple-300 text-sm mb-2";
                    fbTitle.innerText = t.detailedFeedbackTitle;
                    feedbackBox.appendChild(fbTitle);
                    questions.forEach((q, idx) => {
                        let ansObj = sub.answers[idx] || {};
                        let qDiv = document.createElement('div');
                        qDiv.className = "bg-black/30 p-3 rounded-lg space-y-1 border border-white/10";
                        qDiv.innerHTML = '<p class="font-bold text-purple-200">سؤال ' + (idx + 1) + ': ' + q.text + '</p>' +
                                         '<p class="text-gray-300">إجابتك: <span class="text-yellow-300">' + (ansObj.answer || 'مرفق صورة') + '</span></p>' +
                                         '<div class="bg-purple-950/50 p-2 rounded mt-1 border border-purple-500/30">' +
                                         '<p class="font-bold text-green-300">درجة السؤال: ' + (ansObj.aiAwardedPoints || 0) + ' / ' + q.points + '</p>' +
                                         '<p class="text-gray-200 mt-1"><b>تقرير الـ AI:</b> ' + (ansObj.aiEvaluation || 'قيد المعالجة') + '</p>' +
                                         '</div>';
                        feedbackBox.appendChild(qDiv);
                    });
                    box.appendChild(feedbackBox);
                } else {
                    let spinner = document.createElement('div');
                    spinner.className = "animate-spin rounded-full h-12 w-12 border-b-2 border-purple-400 mx-auto";
                    box.appendChild(spinner);
                    let title = document.createElement('h2');
                    title.className = "text-xl font-bold text-yellow-300";
                    title.innerText = t.pendingTitle;
                    box.appendChild(title);
                    let statusText = document.createElement('p');
                    statusText.className = "text-gray-300 text-sm";
                    statusText.innerHTML = 'الحالة: <span class="text-yellow-400 font-bold">' + t.pendingStatus + '</span>';
                    box.appendChild(statusText);
                    let subText = document.createElement('p');
                    subText.className = "text-xs text-gray-400";
                    subText.innerText = t.pendingSub;
                    box.appendChild(subText);
                }
                container.appendChild(box);
                let timerBox = document.getElementById('timer-box');
                if(timerBox) timerBox.style.display = 'none';
                return;
            }
            if (examSettings.status !== 'متاح للطلاب' && examSettings.status !== 'Open') {
                let msg = document.createElement('div');
                msg.className = "text-center py-10 text-red-300 font-bold";
                msg.innerText = t.notAvailable;
                container.appendChild(msg);
                let timerBox = document.getElementById('timer-box');
                if(timerBox) timerBox.style.display = 'none';
                return;
            }
            if (questions.length === 0) {
                let msg = document.createElement('div');
                msg.className = "text-center py-10 text-gray-300";
                msg.innerText = t.noQuestions;
                container.appendChild(msg);
                return;
            }
            let form = document.createElement('form');
            form.id = "submit-form";
            form.className = "space-y-6";
            form.onsubmit = submitExam;
            questions.forEach((q, index) => {
                let qCard = document.createElement('div');
                qCard.className = "bg-black/20 p-4 rounded-xl border border-white/10 space-y-3";
                let qTitle = document.createElement('label');
                qTitle.className = "block font-bold text-purple-200";
                qTitle.innerText = (index + 1) + ". " + q.text + " (" + q.points + " pts)";
                qCard.appendChild(qTitle);
                if (q.questionFileBase64) {
                    let qImg = document.createElement('img');
                    qImg.src = q.questionFileBase64;
                    qImg.className = "max-h-48 mt-2 rounded border border-white/20";
                    qCard.appendChild(qImg);
                }
                if (q.type === 'mcq' && q.rawOptions && q.rawOptions.length > 0) {
                    q.rawOptions.forEach((optText, optIdx) => {
                        let arabicLetters = ['أ', 'ب', 'ج', 'د', 'هـ'];
                        let letter = arabicLetters[optIdx] || (optIdx + 1);
                        let fullOptionValue = letter + ") " + optText;
                        let optLabel = document.createElement('label');
                        optLabel.className = "flex items-center space-x-3 space-x-reverse bg-black/30 p-2 rounded-lg cursor-pointer hover:bg-black/50";
                        let radio = document.createElement('input');
                        radio.type = "radio";
                        radio.name = "q_" + index;
                        radio.value = fullOptionValue;
                        radio.required = true;
                        radio.className = "text-purple-600";
                        let span = document.createElement('span');
                        span.innerText = fullOptionValue;
                        optLabel.appendChild(radio);
                        optLabel.appendChild(span);
                        qCard.appendChild(optLabel);
                    });
                } else {
                    let textarea = document.createElement('textarea');
                    textarea.name = "q_" + index;
                    textarea.rows = 3;
                    textarea.className = "w-full bg-black/40 border border-white/20 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500";
                    textarea.placeholder = t.essayPlaceholder;
                    qCard.appendChild(textarea);
                }
                let fileBox = document.createElement('div');
                fileBox.className = "pt-2";
                let fileLabel = document.createElement('label');
                fileLabel.className = "text-xs text-gray-300 block mb-1";
                fileLabel.innerText = t.uploadImgLabel;
                fileBox.appendChild(fileLabel);
                let fileInput = document.createElement('input');
                fileInput.type = "file";
                fileInput.id = "file_" + index;
                fileInput.accept = "image/png,image/jpeg,image/webp,.pdf";
                fileInput.className = "text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer";
                fileBox.appendChild(fileInput);
                qCard.appendChild(fileBox);
                form.appendChild(qCard);
            });
            let submitBtn = document.createElement('button');
            submitBtn.type = "submit";
            submitBtn.className = "w-full bg-green-600 hover:bg-green-500 transition py-3 rounded-lg font-bold shadow-lg text-white";
            submitBtn.innerText = t.submitBtn;
            form.appendChild(submitBtn);
            container.appendChild(form);
        }
        function submitExam(e) {
            e.preventDefault();
            window.triggerAutomaticSubmission();
        }
        window.triggerAutomaticSubmission = async function() {
            let container = document.getElementById('exam-container');
            container.innerHTML = `
                <div class="text-center py-10 space-y-4">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-400 mx-auto"></div>
                    <h2 class="text-xl font-bold text-yellow-300">جاري تصحيح الامتحان بالذكاء الاصطناعي...</h2>
                    <p class="text-xs text-gray-400">يرجى الانتظار لحظات حتى تظهر نتيجتك النهائية.</p>
                </div>
            `;
            let studentAnswers = {};
            let totalQ = questions.length;
            let openaiApiKey = localStorage.getItem('openaiApiKey') || '';
            let processedCount = 0;
            questions.forEach((q, index) => {
                let ans = "";
                if (q.type === 'mcq') {
                    let selected = document.querySelector('input[name="q_' + index + '"]:checked');
                    ans = selected ? selected.value : "";
                } else {
                    let textareaElem = document.querySelector('textarea[name="q_' + index + '"]');
                    ans = textareaElem ? textareaElem.value : "";
                }
                let fileInput = document.getElementById('file_' + index);
                if(fileInput&&fileInput.files&&fileInput.files[0]){
                    let file=fileInput.files[0];
                    let ok=["image/png","image/jpeg","image/webp","application/pdf"].includes(file.type);
                    if(!ok){
                        alert(currentLang==="ar"?"صيغة الملف غير مدعومة. استخدم JPG أو PNG أو WEBP أو PDF.":"Unsupported file type. Use JPG, PNG, WEBP or PDF.");
                        renderExamPage();
                        return;
                    }
                    let reader=new FileReader();
                    reader.onload=function(uploadEvent){
                        studentAnswers[index]={answer:ans,image:uploadEvent.target.result};
                        processGrading(studentAnswers,totalQ,openaiApiKey,++processedCount);
                    };
                    reader.onerror=function(){
                        alert(currentLang==="ar"?"تعذر قراءة الملف المرفوع.":"Could not read uploaded file.");
                        renderExamPage();
                    };
                    reader.readAsDataURL(file);
                } else {
                    studentAnswers[index] = { answer: ans, image: null };
                    processGrading(studentAnswers, totalQ, openaiApiKey, ++processedCount);
                }
            });
        };
        async function processGrading(answersObj, totalQ, openaiApiKey, count) {
            if (count < totalQ) return;
            let totalCalculatedScore = 0;
            for (let qIdx = 0; qIdx < questions.length; qIdx++) {
                let q = questions[qIdx];
                let ansObj = answersObj[qIdx];
                if (q.type === 'mcq') {
                    let studentFirstChar = (ansObj?.answer || "").trim().charAt(0);
                    let modelFirstChar = (q.modelAnswer || "").trim().charAt(0);
                    if (studentFirstChar === modelFirstChar && modelFirstChar !== "") {
                        totalCalculatedScore += (q.points || 5);
                        ansObj.aiAwardedPoints = q.points || 5;
                        ansObj.aiEvaluation = currentLang === 'ar' ? "تم تصحيح السؤال الاختياري بنجاح ومطابقته للإجابة النموذجية." : "MCQ graded successfully and matched model answer.";
                    } else {
                        ansObj.aiAwardedPoints = 0;
                        ansObj.aiEvaluation = currentLang === 'ar' ? "إجابة خاطئة لم تتطابق مع الاختيار النموذجي." : "Incorrect answer, did not match model choice.";
                    }
                } else if (q.type === 'essay') {
                    if (!openaiApiKey) {
                        ansObj.aiAwardedPoints = 0;
                        ansObj.aiEvaluation = currentLang === 'ar' ? "لم يتم إدخال مفتاح الـ AI، بانتظار المراجعة." : "API key missing.";
                        continue;
                    }
                    let langInstruction = (currentLang === 'ar') 
                        ? 'قم بتقييم إجابة الطالب المرفقة (سواء كانت في الصورة أو النص) بمقارنتها بدقة مع هينت أو إجابة الأستاذ النموذجية. امنح الدرجة باستحقاق كامل بناءً على صحة الحل.' 
                        : 'Evaluate the student answer (provided in image or text) by comparing it accurately with the instructor hint. Award points based on correctness.';
                    let promptText = `You are an expert exam grader with strong OCR and handwriting-reading ability.

The student answer image is the PRIMARY SOURCE for grading. You MUST inspect the actual pixels of the attached student-answer image before deciding the score.

The student may use handwritten Arabic or English, numbers, mathematical equations, symbols, diagrams, tables, or mixed handwriting.
Carefully read the handwriting from the image, even if it is not perfectly neat.
Do NOT say the image is unreadable unless the writing is genuinely impossible to distinguish after carefully examining the image.
Do NOT rely only on the typed Student Text Answer field.

First, transcribe what you can read from the student's image as accurately as possible. Preserve equations, numbers, and important symbols.
Then compare that transcription and the visible work in the image with the question and instructor hint/model answer.

Question:
${q.text}

Instructor Hint / Model Answer:
${q.essayHintText || 'Use the attached instructor hint file/image.'}

Student Text Answer:
${ansObj?.answer || 'No typed answer. The actual answer is attached as a student image.'}

Maximum Points:
${q.points || 5}

Grading rules:
- Give credit for correct reasoning even when wording differs from the model answer.
- For mathematics, inspect the calculations and final result carefully.
- For diagrams, inspect labels and relationships visible in the image.
- Do not give 0 merely because the answer is handwritten.
- If only part of the answer is readable, grade the readable part fairly and explain the limitation.
- Give 0 for unreadable content only when the image truly cannot be interpreted.

Return the structured result with the student's transcription, awarded points, and clear feedback.`;
                    let contentMessages=[{type:"input_text",text:promptText}];
                    addAIFile(contentMessages,q.questionFileBase64,"question");
                    addAIFile(contentMessages,q.hintFileBase64,"instructor-hint");
                    addAIFile(contentMessages,ansObj?.image,"student-answer");
                    try{
                        let resultStr=await callAI(contentMessages,openaiApiKey);
                        let aiResult=JSON.parse(resultStr);
                        let awarded=Number(aiResult.awardedPoints);
                        if(!Number.isFinite(awarded))awarded=0;
                        awarded=Math.max(0,Math.min(q.points||5,awarded));
                        ansObj.aiAwardedPoints=awarded;
                        ansObj.aiTranscription=aiResult.studentTranscription||"";
                        ansObj.aiEvaluation=aiResult.feedback||(currentLang==='ar'?"تم التصحيح بناءً على مطابقة هينت الأستاذ.":"Graded based on instructor hint match.");
                        totalCalculatedScore+=awarded;
                    }catch(err){
                        console.error("OpenAI Error:",err);
                        ansObj.aiAwardedPoints=0;
                        ansObj.aiEvaluation=(currentLang==='ar'?"خطأ في قراءة/تصحيح الملف: ":"AI file/grading error: ")+err.message;
                    }
                }
            }
            submissions[studentID] = {
                studentId: studentID,
                studentName: studentName,
                answers: answersObj,
                autoScore: totalCalculatedScore,
                finalScore: totalCalculatedScore,
                status: 'معتمد',
                graded: true,
                teacherNotes: currentLang === 'ar' ? "تم التصحيح ورصد الدرجة تلقائياً بواسطة الـ AI." : "Graded and scored automatically by AI"
            };
            try {
                await setDoc(doc(db, "examData", "submissions"), { list: submissions });
                alert(translations[currentLang].successAlert);
                renderExamPage();
            } catch(error) {
                console.error("Error saving automatic submission:", error);
            }
        }
        function initTimer() {
            let durationMinutes = parseInt(examSettings.duration) || 10;
            let totalSeconds = durationMinutes * 60;
            localStorage.removeItem('examRemainingSeconds');
            localStorage.removeItem('lastExamDuration');
            let timerInterval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("انتهى وقت الامتحان! سيتم قفل الامتحان وتسليم إجاباتك أوتوماتيكياً الآن.");
                    window.triggerAutomaticSubmission();
                    let form = document.getElementById('submit-form');
                    if(form) form.innerHTML = '<div class="text-center py-10 text-red-400 font-bold text-lg">انتهى وقت الامتحان وتم قفل الصفحة بنجاح!</div>';
                    return;
                }
                totalSeconds--;
                let m = Math.floor(totalSeconds / 60);
                let s = totalSeconds % 60;
                let timerElem = document.getElementById('time-left');
                if (timerElem) {
                    timerElem.innerText = m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');
                }
            }, 1000);
        }
        window.toggleLanguage = toggleLanguage;
    </script>
</body>
</html>
